repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy gower_metric tests comparison
        language: system
        pass_filenames: false

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --fix
        args: [gower_metric/cpp/bindings.cpp, gower_metric/cpp/config/gower_config.cpp]
        language: system
        pass_filenames: false
        files: ^gower_metric/cpp/.*\.(cpp|hpp)$

  - repo: local
    hooks:
      - id: derive-license-header
        name: derive license header from LICENSE.txt
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'printf "%s\nSPDX-License-Identifier: %s\n"
          "$(grep -m1 ^Copyright LICENSE.txt)"
          "$(sed -n "1s/ License$//p" LICENSE.txt)"
          > .license-header.generated.txt'

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: insert license (Python)
        files: \.py$
        args:
          - --license-filepath
          - .license-header.generated.txt
          - --use-current-year
          - --comment-style
          - "#"

      - id: insert-license
        alias: insert-license-cpp
        name: insert license (C++)
        files: ^gower_metric/cpp/.*\.(cpp|hpp)$
        args:
          - --license-filepath
          - .license-header.generated.txt
          - --use-current-year
          - --comment-style
          - "//"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.5.0
    hooks:
      - id: clang-format
        args: [--style=file]

  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff