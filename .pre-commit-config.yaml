repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --package gower_metric --package tests --package examples --package comparison
        language: system
        pass_filenames: false

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --fix
        args: [gower_metric/cpp/bindings.cpp, gower_metric/cpp/config/gower_config.cpp]
        language: system
        pass_filenames: false
        files: ^gower_metric/cpp/.*\.(cpp|hpp)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.5.0
    hooks:
      - id: clang-format
        args: [--style=file]

  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff