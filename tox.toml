[tox]
requires = ["tox>=4.22"]

[env_run_base]
description = "Run tests"
dependency_groups = ["tests"]
commands = [["pytest", "--ignore=tests/r_comparison", { replace = "posargs", default = ["tests/gower_api", "tests/cpp"], extend = true }]]

[env.py310]
description = "Run tests with Python 3.10"
base_python = ["python3.10"]

[env.py311]
description = "Run tests with Python 3.11"
base_python = ["python3.11"]

[env.py312]
description = "Run tests with Python 3.12"
base_python = ["python3.12"]

[env.py313]
description = "Run tests with Python 3.13"
base_python = ["python3.13"]

[env.py314]
description = "Run tests with Python 3.14"
base_python = ["python3.14"]

[env.py314t]
description = "Run tests with Python 3.14-freethread"
base_python = ["python3.14t"]

[env.py]
description = "Run tests with current Python"

[env.r]
description = "Compare with R (needs R and its cluster and gower packages)"
dependency_groups = ["tests", "r_env_tests"]
commands = [["pytest", { replace = "posargs", default = ["tests/r_comparison"], extend = true }]]

[env.package]
description = "Build sdist + wheel"
skip_install = true
dependency_groups = []
deps = ["build"]
commands = [
    ["python", "-m", "build"],
]
