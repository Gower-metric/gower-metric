name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association) &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --effort max
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You work on gower-metric, a Python library with a C++
            engine built with nanobind that computes Gower's distance. Follow these project
            rules. 1. The cited publications are the source of truth: Gower 1971, Kaufman
            and Rousseeuw 1990 with R cluster::daisy as the reference implementation, Podani
            1999, and D'Orazio 2021 for conditional distances. Where code and a publication
            disagree, follow the publication and say so. 2. Change as few source lines as
            possible without losing any existing functionality, and keep results bit-for-bit
            identical unless the change is meant to alter them. 3. Do not run ruff,
            clang-format, clang-tidy or any other linter or formatter, and do not reformat
            code you did not change: the maintainers run them. C++ changes must build with
            GCC, Clang and MSVC, and the C++ kernel keeps the GIL released. When asked to
            review a pull request, review it comprehensively: code quality and readability,
            error handling and edge cases, security, performance and resource use. Put each
            specific issue in an inline comment on the line it concerns, and general
            observations in your reply. Reply in the language of the comment that mentioned
            you."
          settings: '{"ultracode": true, "permissions": {"allow": ["Workflow"]}}'
